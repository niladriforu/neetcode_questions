# Delta Live Tables pipeline configuration resource
resources:
  pipelines:
    dlt_data_pipeline:
      name: "data_processing_pipeline"
      target: "${var.catalog}.${var.schema}"
      libraries:
        - notebook:
            path: /Workspace/notebooks/etl/01_etl_pipeline.py
      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 5
            mode: ENHANCED
      development: true
      continuous: false
      channel: CURRENT
