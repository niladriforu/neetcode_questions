# Databricks Jobs configuration
resources:
  jobs:
    etl_batch_job:
      name: "ETL Batch Processing Job"
      tasks:
        - task_key: ingest_data
          notebook_task:
            notebook_path: /Workspace/notebooks/etl/01_etl_pipeline.py
            source: WORKSPACE
          job_cluster_key: default_cluster
        
        - task_key: api_integration
          depends_on:
            - task_key: ingest_data
          notebook_task:
            notebook_path: /Workspace/notebooks/etl/02_api_integration.py
            source: WORKSPACE
          job_cluster_key: default_cluster
        
        - task_key: data_analysis
          depends_on:
            - task_key: api_integration
          notebook_task:
            notebook_path: /Workspace/notebooks/analysis/data_analysis.py
            source: WORKSPACE
          job_cluster_key: default_cluster
      
      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2
            spark_conf:
              "spark.databricks.delta.preview.enabled": "true"
      
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"  # Daily at 2 AM
        timezone_id: "UTC"
      
      email_notifications:
        on_failure:
          - "data-team@example.com"
